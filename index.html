<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>*** право для любимого</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="Назад">‹</button>
    <div class="brand-wrap"><div class="meow">meow meow meow</div>
    <button id="homeBtn" class="icon-btn hidden" aria-label="Главная">⌂</button>
  </header>

  <main id="screen"></main>

  <footer id="nav" class="bottom-nav">
    <button data-screen="home" class="nav-item active"><span>⌂</span><b>Главная</b></button>
    <button data-screen="tickets" class="nav-item"><span>№</span><b>Билеты</b></button>
    <button data-screen="favorites" class="nav-item"><span>★</span><b>Избранное</b></button>
    <button data-screen="wrong" class="nav-item"><span>×</span><b>Ошибки</b></button>
  </footer>
</div>
<script src="data.js"></script>
<script>
const KEY='rim-right-v1';
const state=JSON.parse(localStorage.getItem(KEY)||'null')||{
  favorites:[], wrong:[], progress:null
};
const screen=document.getElementById('screen');
const nav=document.getElementById('nav');
const backBtn=document.getElementById('backBtn');
const homeBtn=document.getElementById('homeBtn');
let currentView='home';

function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function qs(id){return document.getElementById(id);}
function fav(id){return state.favorites.includes(id);}
function wrong(id){return state.wrong.includes(id);}
function toggleFav(id){state.favorites=fav(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();renderQuiz();}
function markWrong(id,isWrong){
  state.wrong=isWrong?(wrong(id)?state.wrong:[...state.wrong,id]):state.wrong.filter(x=>x!==id);
  save();
}
function ticketByQuestion(id){
  const n=Number(id.split('-')[0]); return BANK.find(t=>t.ticket===n);
}
function findQuestion(id){
  const t=ticketByQuestion(id); return t?.questions.find(q=>q.id===id);
}
function shuffled(q){
  if(q.type!=='choice') return null;
  const arr=q.options.map((text,i)=>({text,i}));
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function setView(v){
  currentView=v; nav.classList.toggle('hidden',v==='quiz');
  backBtn.classList.toggle('hidden',v==='home'||v==='quiz');
  homeBtn.classList.toggle('hidden',v==='home'||v==='quiz');
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.screen===v));
  if(v==='home') renderHome();
  if(v==='tickets') renderTickets();
  if(v==='favorites') renderList('favorites');
  if(v==='wrong') renderList('wrong');
}
function renderHome(){
 screen.innerHTML=`
 <section class="home">
   <h1>*** право для любимого</h1>
   ${state.progress?`<button class="primary big" id="resume">Продолжить тест</button>
   <button class="secondary big" id="restart">Начать заново</button>`:
   `<button class="primary big" id="all">Прорешать все билеты</button>`}
   <button class="secondary big" id="tickets">Билеты 1–50</button>
   <div class="home-grid">
     <button class="tile" id="fav">★<span>Избранное</span><small>${state.favorites.length}</small></button>
     <button class="tile" id="wrong">×<span>Неправильно отвеченные</span><small>${state.wrong.length}</small></button>
   </div>
 </section>`;
 qs('all')?.addEventListener('click',()=>startAll(false));
 qs('resume')?.addEventListener('click',()=>resume());
 qs('restart')?.addEventListener('click',()=>startAll(true));
 qs('tickets')?.addEventListener('click',()=>setView('tickets'));
 qs('fav')?.addEventListener('click',()=>setView('favorites'));
 qs('wrong')?.addEventListener('click',()=>setView('wrong'));
}
function renderTickets(){
 screen.innerHTML=`<section class="page"><h2>Билеты 1–50</h2><div class="ticket-grid">
 ${BANK.map(t=>`<button class="ticket-card" data-ticket="${t.ticket}"><b>Билет ${t.ticket}</b><span>${t.questions.length} вопроса</span></button>`).join('')}
 </div></section>`;
 document.querySelectorAll('[data-ticket]').forEach(b=>b.onclick=()=>startTicket(Number(b.dataset.ticket),false));
}
function renderList(kind){
 const ids=state[kind];
 const title=kind==='favorites'?'Избранное':'Неправильно отвеченные';
 const items=ids.map(id=>({id,q:findQuestion(id),t:ticketByQuestion(id)})).filter(x=>x.q&&x.t);
 screen.innerHTML=`<section class="page"><h2>${title}</h2>
 ${items.length?items.map(x=>`<button class="list-card" data-q="${x.id}">
   <div><b>Билет ${x.t.ticket} · Вопрос ${x.id.split('-')[1]}</b><p>${esc(x.q.text)}</p></div>
   <span>›</span>
 </button>`).join(''):`<div class="empty">Здесь пока ничего нет.</div>`}
 </section>`;
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>startListQuestion(b.dataset.q));
}
function startAll(reset){
 const questions=[];
 BANK.forEach(t=>t.questions.forEach(q=>questions.push(q.id)));
 beginSession('all',questions,0,reset);
}
function startTicket(n,reset){
 const t=BANK.find(x=>x.ticket===n);
 beginSession('ticket',t.questions.map(q=>q.id),0,reset);
}
function startListQuestion(id){beginSession('single',[id],0,true);}
function beginSession(mode,ids,index,reset){
 if(!reset && state.progress){resume();return;}
 const order=ids.map(id=>id);
 const shuffledOptions={};
 order.forEach(id=>{const q=findQuestion(id); if(q.type==='choice') shuffledOptions[id]=shuffled(q);});
 state.progress={mode,ids:order,index,answers:{},shuffledOptions};
 save(); renderQuiz();
}
function resume(){if(state.progress){currentView='quiz';nav.classList.add('hidden');backBtn.classList.remove('hidden');homeBtn.classList.remove('hidden');renderQuiz();}}
function exitQuiz(saveIt=true){if(saveIt)save(); setView('home');}
function renderQuiz(){
 const p=state.progress;if(!p){setView('home');return;}
 const id=p.ids[p.index], q=findQuestion(id), t=ticketByQuestion(id);
 if(!q){p.index++;save();renderQuiz();return;}
 const total=p.ids.length, answered=p.answers[id];
 const options=p.shuffledOptions[id];
 screen.innerHTML=`<section class="quiz">
   <div class="quiz-head"><div><b>Билет ${t.ticket}</b><span>Вопрос ${q.id.split('-')[1]}</span></div>
   <button class="save-exit" id="saveExit">Сохранить и выйти</button></div>
   <div class="progress"><i style="width:${Math.round((p.index/total)*100)}%"></i></div>
   <div class="q-meta">${p.index+1} из ${total}</div>
   <button class="favorite ${fav(id)?'on':''}" id="favorite">${fav(id)?'★ В избранном':'☆ В избранное'}</button>
   <h2 class="question">${esc(q.text)}</h2>
   ${q.type==='choice'?renderChoice(q,options,answered,id):renderText(q,answered,id)}
   <div class="quiz-actions">
     <button class="secondary" id="restartThis">Начать заново</button>
   </div>
 </section>`;
 qs('saveExit').onclick=()=>exitQuiz(true);
 qs('favorite').onclick=()=>toggleFav(id);
 qs('restartThis').onclick=()=>restartSession();
 if(q.type==='choice'){
   document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answerChoice(id,Number(b.dataset.opt)));
 }else{
   qs('textAnswer')?.focus();
   qs('submitText').onclick=()=>submitText(id);
   qs('markTrue')?.addEventListener('click',()=>gradeText(id,true));
   qs('markFalse')?.addEventListener('click',()=>gradeText(id,false));
 }
}
function renderChoice(q,options,answered,id){
 if(answered){
   const correct=q.correct;
   return `<div class="answers">${options.map((o,idx)=>`<div class="answer ${o.i===correct?'correct':''} ${answered.selected===idx?'chosen':''}">
     <span class="radio">${o.i===correct?'✓':answered.selected===idx?'×':''}</span>${esc(o.text)}
   </div>`).join('')}</div>
   <div class="result ${answered.ok?'ok':'bad'}">${answered.ok?'Верно':'Неверно'}${answered.ok?'':' — правильный вариант: '+esc(q.options[correct])}</div>
   <button class="primary big" id="next" onclick="nextQuestion()">Следующий вопрос</button>`;
 }
 return `<div class="answers">${options.map((o,idx)=>`<button class="answer" data-opt="${idx}"><span class="radio"></span>${esc(o.text)}</button>`).join('')}</div>`;
}
function answerChoice(id,selected){
 const q=findQuestion(id), opts=state.progress.shuffledOptions[id];
 const ok=opts[selected].i===q.correct;
 state.progress.answers[id]={selected,ok};
 markWrong(id,!ok); save(); renderQuiz();
}
function renderText(q,answered,id){
 if(answered?.graded!==undefined){
   return `<div class="typed"><div class="your-answer"><b>Ваш ответ</b><p>${esc(answered.text||'—')}</p></div>
   <div class="correct-box"><b>Правильная формулировка</b><p>${esc(q.answer)}</p></div>
   <div class="grade-title">Оцените свой ответ</div>
   <div class="grade-buttons"><button class="grade true" id="markTrue">Верно</button><button class="grade false" id="markFalse">Неверно</button></div>
   <button class="primary big" onclick="nextQuestion()">Следующий вопрос</button></div>`;
 }
 return `<div class="typed"><textarea id="textAnswer" placeholder="Введите свой ответ"></textarea>
 <button class="primary big" id="submitText">Ответить</button></div>`;
}
function submitText(id){
 const input=qs('textAnswer');
 const text=input?.value.trim();
 if(!text){
   input?.focus();
   return;
 }
 // Сохраняем ответ, но не считаем вопрос пройденным до оценки студента.
 state.progress.answers[id]={text,graded:null};
 save();
 showTextAnswerModal(id);
}
function showTextAnswerModal(id){
 const q=findQuestion(id);
 const answer=state.progress.answers[id];
 const modal=document.createElement('div');
 modal.className='modal-backdrop';
 modal.id='textAnswerModal';
 modal.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
   <h3 id="modalTitle">Правильный ответ</h3>
   <div class="modal-answer">${esc(q.answer)}</div>
   <p class="modal-question">Ваш ответ:<br><b>${esc(answer.text)}</b></p>
   <p class="modal-prompt">Верно?</p>
   <div class="grade-buttons modal-buttons">
     <button class="grade true" id="modalTrue">Верно</button>
     <button class="grade false" id="modalFalse">Неверно</button>
   </div>
 </div>`;
 document.body.appendChild(modal);
 qs('modalTrue').onclick=()=>{modal.remove(); gradeText(id,true);};
 qs('modalFalse').onclick=()=>{modal.remove(); gradeText(id,false);};
}
function gradeText(id,isCorrect){
 if(!state.progress?.answers[id]) return;
 state.progress.answers[id].graded=isCorrect;
 markWrong(id,!isCorrect);
 save(); renderQuiz();
}
function nextQuestion(){
 const p=state.progress;
 if(p.index<p.ids.length-1){p.index++;save();renderQuiz();}
 else {state.progress=null;save();renderFinish();}
}
function renderFinish(){
 nav.classList.remove('hidden');backBtn.classList.add('hidden');homeBtn.classList.add('hidden');
 screen.innerHTML=`<section class="finish"><div class="finish-icon">✓</div><h2>Тест завершён</h2>
 <p>Все вопросы в выбранном режиме пройдены.</p><button class="primary big" id="finishHome">На главную</button></section>`;
 qs('finishHome').onclick=()=>setView('home');
}
function restartSession(){
 if(!confirm('Начать этот тест заново? Текущий прогресс этого теста будет сброшен.'))return;
 const p=state.progress; beginSession(p.mode,p.ids,0,true);
}
backBtn.onclick=()=>exitQuiz(true);
homeBtn.onclick=()=>setView('home');
document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>setView(b.dataset.screen));
setView('home');
</script>
</body>
</html>
